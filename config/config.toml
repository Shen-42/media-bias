# Pipeline configuration. Model names and revisions are pinned for reproducibility.
# Thresholds marked "dev-tuned" are set only from eval/dev_crash.csv.

[corpus]
start = "2023-01-01"
end = "2026-10-31"
db = "data/corpus.sqlite"
raw_dir = "data/raw"
cache_dir = "data/cache"

[fetch]
user_agent = "media-bias-research/0.1 (non-commercial academic crawler)"
min_delay_s = 2.0
timeout_s = 45

# Outlets in scope after the Phase 0 source check (docs/sources.md, DECISIONS.md D-19..D-23).
[outlets.citynews]
name = "CityNews Toronto"
domain = "toronto.citynews.ca"
crawl_delay_s = 10.0

[outlets.ctv]
name = "CTV News Toronto"
domain = "www.ctvnews.ca"
path_prefix = "/toronto/"
crawl_delay_s = 2.0

[outlets.global]
name = "Global News"
domain = "globalnews.ca"
crawl_delay_s = 2.0

[outlets.cbc]
name = "CBC Toronto"
domain = "www.cbc.ca"
path_prefix = "/news/canada/toronto/"
crawl_delay_s = 2.0

# Comparison outlets (PLAN.md nice-to-haves, D-99). Stored in data/compare.sqlite, never in
# the main corpus. group = "urbanist": Toronto cycling or urbanist outlets.
[outlets.spacing]
name = "Spacing Toronto"
domain = "spacing.ca"
crawl_delay_s = 2.0
group = "urbanist"

[outlets.thelocal]
name = "The Local"
domain = "thelocal.to"
crawl_delay_s = 2.0
group = "urbanist"

[outlets.cyclingmag]
name = "Canadian Cycling Magazine"
domain = "cyclingmagazine.ca"
crawl_delay_s = 2.0
group = "urbanist"

# Comparison cities (D-100): the same three brands in Vancouver and Montreal. group = "city".
[outlets.citynews_van]
name = "CityNews Vancouver"
domain = "vancouver.citynews.ca"
crawl_delay_s = 10.0
group = "city"
city = "vancouver"

[outlets.citynews_mtl]
name = "CityNews Montreal"
domain = "montreal.citynews.ca"
crawl_delay_s = 10.0
group = "city"
city = "montreal"

[outlets.ctv_van]
name = "CTV News Vancouver"
domain = "www.ctvnews.ca"
crawl_delay_s = 2.0
group = "city"
city = "vancouver"

[outlets.ctv_mtl]
name = "CTV News Montreal"
domain = "www.ctvnews.ca"
crawl_delay_s = 2.0
group = "city"
city = "montreal"

[outlets.global_van]
name = "Global News BC"
domain = "globalnews.ca"
crawl_delay_s = 2.0
group = "city"
city = "vancouver"

[outlets.global_mtl]
name = "Global News Montreal"
domain = "globalnews.ca"
crawl_delay_s = 2.0
group = "city"
city = "montreal"

# French Montreal outlet (D-101). Robots allow it; history comes from the Wayback CDX index,
# pages are fetched from the live site.
[outlets.radiocanada]
name = "Radio-Canada (Grand Montréal)"
domain = "ici.radio-canada.ca"
crawl_delay_s = 2.0
group = "city"
city = "montreal"
language = "fr"

[police]
wayback_prefix = "tps.ca/media-centre/news-releases/"
wayback_delay_s = 2.0

[models.spacy]
parser = "en_core_web_trf"
parser_version = "3.8.0"
fast = "en_core_web_sm"
fast_version = "3.8.0"
# French outlets (D-101)
parser_fr = "fr_dep_news_trf"
fast_fr = "fr_core_news_sm"
fr_version = "3.8.0"

[models.coref]
name = "biu-nlp/f-coref"
revision = "e91dfff12879495d882ba9460d0c5d5dd44ade59"

[models.nli]
name = "MoritzLaurer/deberta-v3-base-zeroshot-v2.0"
revision = "8e7e5af5983a0ddb1a5b45a38b129ab69e2258e8"

[models.embed]
name = "sentence-transformers/all-mpnet-base-v2"
revision = "e8c3b32edf5434bc2275fc9bab85f82640a19130"

[models.setfit_base]
name = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"

[models.babe]
# Loaded-language feature for v1.5 (codebook 9.3). License CC-BY-NC-4.0 (non-commercial use).
name = "mediabiasgroup/da-roberta-babe-ft"
revision = "a1e1b9e2ac97f87387fb0b78e5a1914b5e25532f"

[qwen]
host = "http://localhost:11434"
tag = "qwen3:4b"
digest = "359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7"  # qwen3:4b pinned 2026-11-19
temperature = 0
seed = 42
num_ctx = 4096

[matching]
# dev-tuned: cosine similarity and char 5-gram Jaccard for police_matched
embed_threshold = 0.6
char_threshold = 0.2
release_window_days = 3

[fuzzy]
# Tuned on dev only by eval.tune_fuzzy (D-71). Defaults are the v1.0 values.
nli_hi_vru_conduct_detail = 0.35
nli_hi_thematic_cue = 0.95
snorkel_vru_conduct_detail = 0.7
snorkel_thematic_cue = 0.95
setfit_vru_conduct_detail = 0.95
setfit_thematic_cue = 0.95
# v1.5 transit stance end model (D-86): stance when max(p support, p oppose) >= this; dev macro-F1.
endmodel_stance_transit = 0.7

[eval]
seed = 20261119

[analysis]
# Bill 212 (Reducing Gridlock, Saving You Time Act) royal assent; pre = published before (D-47).
bill212_cutoff = "2024-11-25"
