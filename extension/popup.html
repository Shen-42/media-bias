<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crash framing labels</title>
<style>
  :root { --fg: #1d1d1f; --muted: #5f6368; --line: #dadce0; --bg: #fff; --tag: #eef1f5; --warn: #fff7e0; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaed; --muted: #a0a4a8; --line: #3c4043; --bg: #202124; --tag: #303134; --warn: #3a3320; }
  }
  body { font: 13px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); width: 420px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 10px; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  .sent { border-top: 1px solid var(--line); padding: 8px 0; }
  .text { margin-bottom: 4px; }
  .tags span { display: inline-block; background: var(--tag); border-radius: 4px; padding: 1px 6px; margin: 2px 4px 2px 0; }
  .tags span[title] { cursor: help; }
  .sugg { background: var(--warn); border-radius: 4px; padding: 6px; margin-top: 6px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
  <h1>Crash framing labels</h1>
  <p class="note">Per-sentence labels from the project's rule-based labeler, with the evidence for each (hover a label). No article score. Requires <code>python -m app.score_server</code> running locally.</p>
  <button id="go">Label this page</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
