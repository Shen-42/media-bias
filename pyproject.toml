[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-bias"
version = "0.0.1"
description = "Measures how Toronto local news frames traffic crashes."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45,<5",  # fastcoref breaks on 5.x (DECISIONS.md D-25)
    "sentence-transformers>=3,<6",
    "setfit>=1.1,<2",
    "spacy>=3.8,<3.9",
    "spacy-curated-transformers>=0.3,<0.4",
    "fastcoref==2.1.6",
    "snorkel>=0.10,<0.11",
    "trafilatura>=2,<3",
    "datasketch>=1.6,<3",
    "ollama>=0.4,<1",
    "pandas>=2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lxml>=5",
    "requests>=2.31",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["collect*", "nlp*", "eval*", "app*", "common*", "analysis*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs downloaded HF/spaCy-trf models or Ollama (skipped in CI)",
]
